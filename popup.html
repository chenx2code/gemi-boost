<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GemiBoost Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header: Product branding and version -->
    <header class="popup-header">
      <div class="brand">
        <img class="brand-icon" src="icons/icon32.png" alt="GemiBoost" width="22" height="22">
        <span class="brand-name">GemiBoost</span>
      </div>
      <span class="version-chip" id="versionChip">v1.1.14</span>
    </header>

    <!-- Main Content: Settings options -->
    <main class="popup-main">
      <div class="section-header">
        <span class="section-title" id="sectionTitle">Export Preferences</span>
      </div>

      <div class="settings-card">
        <!-- Option 1: Original conversation link -->
        <label class="setting-row" for="includeLink">
          <div class="setting-leading-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
            </svg>
          </div>
          <div class="setting-info">
            <span class="setting-title" id="linkTitle">Include conversation link</span>
            <span class="setting-desc" id="linkDesc">Add original chat link to Markdown export</span>
          </div>
          <div class="switch-container">
            <input type="checkbox" id="includeLink" class="m3-switch-input">
            <div class="m3-switch-track">
              <div class="m3-switch-thumb">
                <svg class="m3-switch-check" viewBox="0 0 24 24" width="11" height="11">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
              </div>
            </div>
          </div>
        </label>

        <div class="row-divider"></div>

        <!-- Option 2: Account email -->
        <label class="setting-row" for="includeAccount">
          <div class="setting-leading-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
            </svg>
          </div>
          <div class="setting-info">
            <span class="setting-title" id="accountTitle">Include account email</span>
            <span class="setting-desc" id="accountDesc">Add Google account email to Markdown header</span>
          </div>
          <div class="switch-container">
            <input type="checkbox" id="includeAccount" class="m3-switch-input">
            <div class="m3-switch-track">
              <div class="m3-switch-thumb">
                <svg class="m3-switch-check" viewBox="0 0 24 24" width="11" height="11">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
              </div>
            </div>
          </div>
        </label>

        <div class="row-divider"></div>

        <!-- Option 3: Thinking process -->
        <label class="setting-row" for="includeThinking">
          <div class="setting-leading-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 2C7.03 2 3 6.03 3 11c0 2.78 1.28 5.26 3.29 6.89V20c0 .55.45 1 1 1h9.42c.55 0 1-.45 1-1v-2.11C19.72 16.26 21 13.78 21 11c0-4.97-4.03-9-9-9zm-1 17h-2v-1h2v1zm4 0h-2v-1h2v1zm1.71-3.29l-.71.5V18H8v-1.79l-.71-.5A6.974 6.974 0 0 1 5 11c0-3.86 3.14-7 7-7s7 3.14 7 7c0 1.84-.71 3.52-1.99 4.71z"/>
            </svg>
          </div>
          <div class="setting-info">
            <span class="setting-title" id="thinkingTitle">Include thinking process</span>
            <span class="setting-desc" id="thinkingDesc">Export Task and reasoning thoughts</span>
          </div>
          <div class="switch-container">
            <input type="checkbox" id="includeThinking" class="m3-switch-input">
            <div class="m3-switch-track">
              <div class="m3-switch-thumb">
                <svg class="m3-switch-check" viewBox="0 0 24 24" width="11" height="11">
                  <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
              </div>
            </div>
          </div>
        </label>
      </div>

      <!-- Section 2: Obsidian Settings -->
      <div class="section-header" style="margin-top: 14px;">
        <span class="section-title" id="obsidianSectionTitle">Obsidian Import</span>
      </div>

      <div class="settings-card">
        <!-- Obsidian Folder -->
        <div class="setting-field-row">
          <div class="setting-leading-icon obsidian-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 2.2L4.5 8.5 8.2 21.8h7.6L19.5 8.5 12 2.2zm0 3.3l4.5 3.8-2 8.7h-5l-2-8.7 4.5-3.8z"/>
            </svg>
          </div>
          <div class="setting-info">
            <span class="setting-title" id="obsidianFolderTitle">Target folder</span>
            <span class="setting-desc" id="obsidianFolderDesc">Folder inside your vault</span>
          </div>
          <div class="input-container">
            <input type="text" id="obsidianFolder" class="m3-text-input" placeholder="Gemini" spellcheck="false">
          </div>
        </div>

        <div class="row-divider"></div>

        <!-- Obsidian Vault Name (Optional) -->
        <div class="setting-field-row">
          <div class="setting-leading-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/>
            </svg>
          </div>
          <div class="setting-info">
            <span class="setting-title" id="obsidianVaultTitle">Vault name</span>
            <span class="setting-desc" id="obsidianVaultDesc">Leave empty for active vault</span>
          </div>
          <div class="input-container">
            <input type="text" id="obsidianVault" class="m3-text-input" placeholder="Default" spellcheck="false">
          </div>
        </div>
      </div>
    </main>

    <!-- Footer: Auto-save status feedback -->
    <footer class="popup-footer">
      <div class="status-indicator" id="statusIndicator">
        <svg class="status-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
          <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
        </svg>
        <span class="status-text" id="statusText">Changes saved automatically</span>
      </div>
    </footer>
  </div>

  <script src="content-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
